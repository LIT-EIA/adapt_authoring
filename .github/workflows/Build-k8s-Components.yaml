name: Build & Troubleshoot K8s Components 

on:
  workflow_dispatch: # Allows manual triggering


env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}

jobs:
  BuildK8Components:
    runs-on: arc-runners-dshp-dev

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Azure + AKS Login     
      - name: Azure + AKS Login
        uses: ./.github/actions/actions
        with:
          roleId: ${{ env.roleId}}
          secretId: ${{ env.secretId }}

      # Chainguard login
      - name: Log in to Chainguard Registry
        run: |
          docker login cgr.dev \
            --username ${{ secrets.CGR_USERNAME }} \
            --password ${{ secrets.CGR_PASSWORD }}

      # Create Pull Secret
      - name: Create Kubernetes image pull secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=cgr.dev \
            --docker-username=${{ secrets.CGR_USERNAME }} \
            --docker-password=${{ secrets.CGR_PASSWORD }} \
            -n ${{ env.<pii_masked: name> }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Troubleshooting: Search for available mongo packages in Chainguard registry
      - name: Search available mongo packages
        run: |
          docker run --rm --user root --entrypoint /bin/sh \
            cgr.dev/ssc-spc.gc.ca/mongodb:latest-dev \
            -c "apk update && apk search mongo"

      # Troubleshooting: Find which packages provide mongorestore, mongoimport, mongosh
      - name: Find packages providing mongo tools
        run: |
          docker run --rm --user root --entrypoint /bin/sh \
            cgr.dev/ssc-spc.gc.ca/mongodb:latest-dev \
            -c "apk update && apk search cmd:mongorestore && apk search cmd:mongoimport && apk search cmd:mongosh"

      # Troubleshooting: Check which mongo tools are already in the image
      - name: Check pre-installed mongo tools
        run: |
          docker run --rm --user root --entrypoint /bin/sh \
            cgr.dev/ssc-spc.gc.ca/mongodb:latest-dev \
            -c "which mongorestore mongoimport mongosh mongo || true"

      # Step: Build and push chainguard image to ACR
      - name: Build and push app image to ACR
        uses: ./.github/actions/chainguard-build
        with:
          acr-url: dtsrhpdevscedacr.azurecr.io
          mig-image-name: cms_adapt_authoring_mig_cg
          mig-dockerfile: docker/migration/Dockerfile.chainguard
          mig-image-tag: 1
          build-context: .

      # Step 4: Check Kubernetes Components
      - name: Check Kubernetes Components
        uses: ./.github/actions/check-components
        with:
          namespace: ${{ env.NAMESPACE }}

