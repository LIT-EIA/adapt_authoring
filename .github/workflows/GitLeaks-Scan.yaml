name: Delete Kubernetes Components 

on:
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main

env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}
  GITHUB_TOKEN: ${{ secrets.CMS_GITHUB_TOKEN }}
  GITLEAKS_LICENSE: ${{ secrets.CMS_GITLEAKS_LICENSE}}


jobs:
  scan:
    name: gitleaks
    runs-on: arc-runners-dshp-dev
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}


