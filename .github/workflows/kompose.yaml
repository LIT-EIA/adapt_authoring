name: Build Kubernetes Components Using Kompose

on:
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main

env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}


jobs:
  KomposeK8Components:
    runs-on: arc-runners-dshp-dev

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Azure + AKS Login     
      - name: Azure + AKS Login
        uses: ./.github/actions/actions
        with:
          roleId: ${{ env.roleId}}
          secretId: ${{ env.secretId }}

      # Step 3: Build and push app image to ACR
      - name: Build and push app image to ACR
        uses: ./.github/actions/docker-build
        with:
          acr-url: dtsrhpdevscedacr.azurecr.io
          image-name: cms_adapt_authoring
          image-tag: 1.0
          build-context: .


      # Step 4: Build Kubernetes Components Using Kompose
      - name: Build Kubernetes Components Using Kompose
        uses: ./.github/actions/kompose
        with:
          namespace: ${{ env.NAMESPACE }}
          compose-file: docker/docker-compose.yml
          overlay: docker/k8s/overlays/dev

      # Step 5: Check Kubernetes Components
      - name: Check Kubernetes Components
        uses: ./.github/actions/check-components
        with:
          namespace: ${{ env.NAMESPACE }}