name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container
  schedule:
    - cron: '0 13 * * 1-5'

env:
  NAMESPACE: adapt-authoring
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build:
    name: Build and Analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Create Config File
        run: |
          mkdir -p conf
          echo '{}' > conf/config.json

      - name: Build Project
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        id: qualitygate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Download All Sonar Issues
        run: |
          echo '{"issues":[]}' > sonar-issues.json

          PAGE=1
          PAGE_SIZE=500

          while true
          do
            echo "Downloading page ${PAGE}"

            curl -s \
              -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/issues/search?projects=adapt-authoring&ps=${PAGE_SIZE}&p=${PAGE}" \
              > page.json

            COUNT=$(jq '.issues | length' page.json)

            echo "Issues returned: ${COUNT}"

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            jq -s '
              {
                issues: (.[0].issues + .[1].issues)
              }
            ' sonar-issues.json page.json > merged.json

            mv merged.json sonar-issues.json

            PAGE=$((PAGE + 1))
          done

          TOTAL=$(jq '.issues | length' sonar-issues.json)

          echo "Total downloaded issues: ${TOTAL}"

      - name: Generate CSV Report
        run: |
          echo "Severity,Type,File,Line,Message" > sonar-issues.csv

          jq -r '
            .issues[] |
            [
              .severity,
              .type,
              .component,
              (.line // ""),
              .message
            ]
            | @csv
          ' sonar-issues.json >> sonar-issues.csv

      - name: Generate Summary Report
        run: |
          TOTAL=$(jq '.issues | length' sonar-issues.json)

          {
            echo "SonarQube Analysis Summary"
            echo "=========================="
            echo
     