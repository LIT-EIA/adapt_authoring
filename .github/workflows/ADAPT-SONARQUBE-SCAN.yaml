name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container
  schedule:
    - cron: '0 13 * * 1-5'

env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_PROJECT_KEY: adapt-authoring

jobs:
  build:
    name: Build and Analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Create Config File
        run: |
          mkdir -p conf
          echo '{}' > conf/config.json

      - name: Build Project
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Wait for SonarQube Processing
        run: sleep 60

      - name: Test SonarQube API
        run: |
          echo "Testing SonarQube API..."
          curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/server/version" \
            > sonar-version.txt

          echo "SonarQube Version:"
          cat sonar-version.txt

      - name: Retrieve Sonar Metrics
        continue-on-error: true
        run: |
          curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density" \
            > sonar-metrics.json

          echo "Metrics response:"
          cat sonar-metrics.json

      - name: Retrieve Sonar Issues
        continue-on-error: true
        run: |
          curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&ps=100" \
            > sonar-issues.json

          echo