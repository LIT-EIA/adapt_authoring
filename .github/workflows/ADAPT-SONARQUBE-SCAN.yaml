name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container
  schedule:
    - cron: '0 13 * * 1-5'

env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build:
    name: Build and Analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Create Config File
        run: |
          mkdir -p conf
          echo '{}' > conf/config.json

      - name: Build Project
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Sonar Metadata
        run: |
          echo "===== Sonar Report Task ====="

          if [ -f .scannerwork/report-task.txt ]; then
            cat .scannerwork/report-task.txt > sonar-report.txt

            echo "" >> sonar-report.txt
            echo "Repository=${{ github.repository }}" >> sonar-report.txt
            echo "Branch=${{ github.ref_name }}" >> sonar-report.txt
            echo "Commit=${{ github.sha }}" >> sonar-report.txt
          else
            echo "Sonar report-task.txt not found" > sonar-report.txt
          fi

      - name: Publish Summary
        run: |
          echo "# SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f .scannerwork/report-task.txt ]; then
            echo "## Sonar Metadata" >> $GITHUB_STEP_SUMMARY
            cat .scannerwork/report-task.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Sonar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adapt-authoring-sonarqube-report
          path: sonar-report.txt
          retention-days: 7