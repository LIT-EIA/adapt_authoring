name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container
  schedule:
    - cron: '0 13 * * 1-5'

env:
  NAMESPACE: adapt-authoring
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build:
    name: Build and Analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Create Config File
        run: |
          mkdir -p conf
          echo '{}' > conf/config.json

      - name: Build Project
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        id: qualitygate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Download Sonar Issues
        run: |
          curl -s \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/issues/search?projects=adapt-authoring&ps=500" \
            > sonar-issues.json

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Generate CSV Report
        run: |
          echo "Severity,Type,File,Line,Message" > sonar-issues.csv

          jq -r '
            .issues[] |
            [
              .severity,
              .type,
              .component,
              (.line // ""),
              .message
            ] | @csv
          ' sonar-issues.json >> sonar-issues.csv

      - name: Create Summary Report
        run: |
          TOTAL=$(jq -r '.total' sonar-issues.json)

          echo "SonarQube Analysis Report" > sonar-report.txt
          echo "=========================" >> sonar-report.txt
          echo "" >> sonar-report.txt

          echo "Repository: ${{ github.repository }}" >> sonar-report.txt
          echo "Branch: ${{ github.ref_name }}" >> sonar-report.txt
          echo "Commit: ${{ github.sha }}" >> sonar-report.txt
          echo "" >> sonar-report.txt

          echo "Total Issues: $TOTAL" >> sonar-report.txt
          echo "Quality Gate: ${{ steps.qualitygate.outcome }}" >> sonar-report.txt

      - name: Publish GitHub Summary
        run: |
          TOTAL=$(jq -r '.total' sonar-issues.json)

          echo "# SonarQube Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Project: adapt-authoring" >> $GITHUB_STEP_SUMMARY
          echo "- Total Issues: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gate: ${{ steps.qualitygate.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload Sonar Reports
        uses: actions/upload-artifact@v4
        with:
          name: adapt-authoring-sonarqube-report
          path: |
            sonar-report.txt
            sonar-issues.json
            sonar-issues.csv
          retention-days: 7