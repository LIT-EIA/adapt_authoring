name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container  
  schedule:
    - cron: '0 13 * * 1-5' # Mon–Fri at 13:00 UTC

env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build:
    name: Build and analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Create config file
        run: mkdir -p conf && echo '{}' > conf/config.json

      - name: Build project
        run: npm run build

      - uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Create artifact
        run: |
          echo "Build completed successfully" > build-report.txt
          echo "Repository: ${{ github.repository }}" >> build-report.txt
          echo "Branch: ${{ github.ref_name }}" >> build-report.txt
          echo "Commit: ${{ github.sha }}" >> build-report.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adapt-authoring-report
          path: build-report.txt
          retention-days: 2