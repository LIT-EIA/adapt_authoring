name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container
  schedule:
    - cron: '0 13 * * 1-5' # Mon-Fri at 13:00 UTC

env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build:
    name: Build and Analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Create config file
        run: |
          mkdir -p conf
          echo '{}' > conf/config.json

      - name: Build project
        run: npm run build

      - name: Record commit analyzed
        run: |
          echo "Commit SHA: ${{ github.sha }}" > sonar-analysis-info.txt
          echo "Branch: ${{ github.ref_name }}" >> sonar-analysis-info.txt
          echo "Run ID: ${{ github.run_id }}" >> sonar-analysis-info.txt
          echo "Run Date: $(date -u)" >> sonar-analysis-info.txt

      - name: Generate scanned file manifest
        run: |
          find . \
            -type f \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./.scannerwork/*" \
            > scanned-files.txt

      - name: Upload scan manifest
        uses: actions/upload-artifact@v4
        with:
          name: sonar-scan-manifest
          path: |
            scanned-files.txt
            sonar-analysis-info.txt
          retention-days: 3

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Upload SonarScanner metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-scannerwork
          path: .scannerwork/
          if-no-files-found: warn
          retention-days: 3