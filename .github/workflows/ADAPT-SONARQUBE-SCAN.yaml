name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build:
    name: Build and Analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Create Config File
        run: |
          mkdir -p conf
          echo '{}' > conf/config.json

      - name: Build Project
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Show Sonar Metadata
        run: |
          find . -name report-task.txt
          cat .scannerwork/report-task.txt || true

      - name: Test Sonar API with Bearer Token
        run: |
          curl -i \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/server/version" \
            > sonar-api-test.txt

          cat sonar-api-test.txt

      - name: Test Issues API
        continue-on-error: true
        run: |
          curl -i \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/issues/search?projects=adapt-authoring" \
            > sonar-issues-test.txt

          head -50 sonar-issues-test.txt

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonar-debug
          path: |
            sonar-api-test.txt
            sonar-issues-test.txt
          retention-days: 7