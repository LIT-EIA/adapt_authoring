name: Adapt Authoring Repository GitLeaks Scan

on:
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - container
  schedule:
    - cron: '0 13 * * 1-5'  # Mon–Fri at 13:00 UTC

env:
  NAMESPACE: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


jobs:
  build:
    name: Build and analyze
    runs-on: arc-runners-dshp-dev
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Adjust to your project's Node version
      
      - name: Install dependencies
        run: npm install
      
      - name: Create config file
        run: mkdir -p conf && echo '{}' > conf/config.json
      
      - name: Build project
        run: npm run build
      
      - uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

