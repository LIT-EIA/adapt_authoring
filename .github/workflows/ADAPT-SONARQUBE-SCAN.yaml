name: Adapt Authoring Repository SonarQube Scan

on:
  workflow_dispatch:
  push:
    branches:
      - container
  schedule:
    - cron: '0 13 * * 1-5' # Mon-Fri at 13:00 UTC

env:
  NAMESPACE: adapt-authoring
  PROJECT_KEY: adapt-authoring
  roleId: ${{ secrets.APPROLE_ROLE_ID }}
  secretId: ${{ secrets.APPROLE_SECRET_ID }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  build:
    name: Build and Analyze
    runs-on: arc-runners-dshp-dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Create config file
        run: |
          mkdir -p conf
          echo '{}' > conf/config.json

      - name: Build project
        run: npm run build

      #
      # Artifact #1 - Files scanned
      #
      - name: Generate scanned file manifest
        run: |
          find . \
            -type f \
            ! -path "./.git/*" \
            ! -path "./node_modules/*" \
            ! -path "./.scannerwork/*" \
            > scanned-files.txt

      - name: Upload scanned file manifest
        uses: actions/upload-artifact@v4
        with:
          name: scanned-files
          path: scanned-files.txt
          retention-days: 30

      #
      # Run SonarQube
      #
      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.exclusions=**/*.java
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      #
      # Wait briefly for Compute Engine processing
      #
      - name: Wait for SonarQube processing
        run: sleep 30

      #
      # Artifact #2 - Quality Gate Result
      #
      - name: Export Quality Gate
        run: |
          curl -s \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" \
            > quality-gate.json

          cat quality-gate.json

      - name: Upload Quality Gate
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate
          path: quality-gate.json
          retention-days: 30

      #
      # Artifact #3 - Sonar Findings
      #
      - name: Export SonarQube Issues
        run: |
          curl -s \
            -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&ps=500" \
            > sonar-issues.json

          wc -c sonar-issues.json

      - name: Upload Sonar Issues
        uses: actions/upload-artifact@v4
        with:
          name: sonar-issues
          path: sonar-issues.json
          retention-days: 30

      #
      # Optional troubleshooting artifact
      #
      - name: Upload Scanner Metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-scannerwork
          path: .scannerwork/
          if-no-files-found: warn
          retention-days: 30