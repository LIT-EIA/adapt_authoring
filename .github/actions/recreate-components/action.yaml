name: Delete Kubernetes Components
description: Run kubectl and helm inspection commands in a namespace

inputs:
  namespace:
    description: Kubernetes namespace to delete
    required: true

runs:
  using: composite
  steps:
    - name: Delete Kubernetes Components
      shell: bash
      run: |
        NAMESPACE="${{ inputs.namespace }}"

        echo "====================================="
        echo "🔍 Delete Components"
        echo "Namespace: $NAMESPACE"
        echo "====================================="

        kubectl delete deployment mongodb -n "$NAMESPACE"
        kubectl delete service mongodb -n "$NAMESPACE"



