name: Build and Push Image to ACR
description: Build a Docker image and push it to Azure Container Registry

inputs:
  acr-url:
    description: ACR login server (e.g. myacr.azurecr.io)
    required: true

  image-name:
    description: Image name (e.g. adapt-authoring)
    required: true

  image-tag:
    description: Image tag (e.g. commit SHA)
    required: true

  build-context:
    description: Docker build context path
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Build and push Docker image to ACR
      shell: bash
      run: |
        set -euo pipefail

        ACR_URL="${{ inputs.acr-url }}"
        IMAGE_NAME="${{ inputs.image-name }}"
        IMAGE_TAG="${{ inputs.image-tag }}"
        CONTEXT="${{ inputs.build-context }}"

        IMAGE="${ACR_URL}/${IMAGE_NAME}:${IMAGE_TAG}"

        echo "====================================="
        echo "🐳 Building Docker image"
        echo "Registry : $ACR_URL"
        echo "Image    : $IMAGE_NAME"
        echo "Tag      : $IMAGE_TAG"
        echo "Context  : $CONTEXT"
        echo "====================================="

        docker build \
          --pull \
          --no-cache \
          -t "$IMAGE" \
          "$CONTEXT"

        echo "📤 Pushing image to ACR: $IMAGE"
        docker push "$IMAGE"

        echo "✅ Image pushed successfully"
