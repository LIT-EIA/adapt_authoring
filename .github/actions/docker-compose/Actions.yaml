name: Docker Compose Runner
description: Run docker compose using a compose file from anywhere in the repo

inputs:
  compose-file:
    description: Path to docker-compose file (relative to repo root)
    required: true

  command:
    description: Docker compose command (e.g. up -d, down, build)
    required: false
    default: up -d

  project-name:
    description: Optional docker compose project name
    required: false

runs:
  using: composite
  steps:
    - name: Validate Docker
      shell: bash
      run: |
        docker --version
        docker compose version

    - name: Run Docker Compose
      shell: bash
      run: |
        echo "🐳 Docker Compose execution"
        echo "Compose file : ${{ inputs.compose-file }}"
        echo "Command      : ${{ inputs.command }}"

        if [ -n "${{ inputs.project-name }}" ]; then
          docker compose \
            -p "${{ inputs.project-name }}" \
            -f "${{ inputs.compose-file }}" \
            ${{ inputs.command }}
        else
          docker compose \
            -f "${{ inputs.compose-file }}" \
            ${{ inputs.command }}
        fi
