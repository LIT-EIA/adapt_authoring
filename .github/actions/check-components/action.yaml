name: Check Kubernetes Components
description: Run kubectl, helm, and ACR inspection commands in a namespace

inputs:
  namespace:
    description: Kubernetes namespace to check
    required: true

runs:
  using: composite
  steps:

    - name: echo secret
      shell: bash
      run: |
        echo "${{ env.K8S_CLUSTER_NAME }}"

    - name: Check Kubernetes Components
      shell: bash
      run: |
        set -euo pipefail

        NAMESPACE="${{ inputs.namespace }}"
        ACR_NAME="dtsrhpdevscedacr"
        APP_IMAGE="cms_adapt_authoring_app"
        MIG_IMAGE="cms_adapt_authoring_mig"

        echo "====================================="
        echo "🔍 Checking Kubernetes components"
        echo "Namespace: $NAMESPACE"
        echo "====================================="

        echo "⏳ All K8s resources"
        kubectl get all -n "$NAMESPACE"

        echo "⏳ Ingress"
        kubectl get ingress -n "$NAMESPACE" || true

        echo "⏳ ConfigMaps"
        kubectl get configmaps -n "$NAMESPACE" || true

        echo "⏳ Helm releases"
        helm list -n "$NAMESPACE" || true

        echo "⏳ Pods"
        kubectl get pods -n "$NAMESPACE"

        echo "⏳ Secrets"
        kubectl get secret -n "$NAMESPACE" || true

        echo "⏳ PVCs"
        kubectl get pvc -n "$NAMESPACE"

        echo "====================================="
        echo "📦 Azure Container Registry inspection"
        echo "ACR: $ACR_NAME"
        echo "====================================="

        if command -v az >/dev/null 2>&1; then
          echo "✅ Azure CLI detected"

          echo "🏷️ APP image tags ($APP_IMAGE)"
          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$APP_IMAGE" \
            --detail \
            --orderby time_desc \
            --output table || true

          echo "🏷️ MIGRATION image tags ($MIG_IMAGE)"
          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$MIG_IMAGE" \
            --detail \
            --orderby time_desc \
            --output table || true
        else
          echo "⚠️ Azure CLI not available — skipping ACR inspection"
        fi

        echo "✅ Kubernetes and ACR checks completed."
