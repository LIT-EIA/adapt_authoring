apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      initContainers:
        - name: init-storage
          image: busybox
          command:
            - sh
            - -c
            - |

              # Base directories
              mkdir -p /app/storage/plugins/content
              mkdir -p /app/storage/content
              mkdir -p /app/storage/uploads

              cd /app/storage/plugins/content

              # Copy default plugins ONLY if PVC is empty
              if [ ! -d /app/storage/plugins/content/adapt-contrib-text ]; then
                cp -r /app/default-plugins/content/* /app/storage/plugins/content/
              fi
          volumeMounts:
            - name: storage
              mountPath: /app/storage