apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              
              echo "🔍 Checking for migration job..."

              if kubectl get job adapt-migration >/dev/null 2>&1; then
                echo "✅ Migration job found. Waiting for completion..."
                kubectl wait \
                  --for=condition=complete \
                  job/adapt-migration \
                  --timeout=10m
              else
                echo "ℹ️ Migration job not found. Skipping wait."
              fi


      containers:
        - name: app
          imagePullPolicy: Always
          command: null
          workingDir: null
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data
              
