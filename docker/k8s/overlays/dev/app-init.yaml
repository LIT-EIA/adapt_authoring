apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      initContainers:

        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "🔍 Checking for migration job..."

              if kubectl get job adapt-migration >/dev/null 2>&1; then
                echo "✅ Migration job found. Waiting..."
                kubectl wait --for=condition=complete job/adapt-migration --timeout=10m
              else
                echo "ℹ️ Migration job not found."
              fi

        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Fixing permissions..."
              chown -R 1000:1000 /app/temp /app/storage /app/data

          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data

      containers:
        - name: app
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}