apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      initContainers:

        # ✅ 1. Wait for migration job
        - name: wait-for-migration
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "🔍 Checking for migration job..."

              if kubectl get job adapt-migration >/dev/null 2>&1; then
                echo "✅ Migration job found. Waiting for completion..."
                kubectl wait \
                  --for=condition=complete \
                  job/adapt-migration \
                  --timeout=10m
              else
                echo "ℹ️ Migration job not found. Skipping wait."
              fi

        # ✅ 2. Fix permissions (THIS is what you need)
        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Fixing permissions..."
              chown -R 1000:1000 /app/temp /app/storage /app/data


          securityContext:
           runAsUser: 0


          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data

      containers:
        - name: app
          imagePullPolicy: Always

          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data
