apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      initContainers:
        - name: init-storage
          image: node:18
          command:
            - sh
            - -c
            - |
              set -e

              # Base directories
              mkdir -p /app/storage/content
              mkdir -p /app/storage/uploads
              mkdir -p /app/storage/plugins/content

              cd /app/storage/plugins/content

              # Install content plugins ONLY if not already installed
              if [ ! -d adapt-contrib-text ]; then
                echo "Installing Adapt content plugins..."
                npm init -y >/dev/null 2>&1
                npm install \
                  adapt-contrib-text \
                  adapt-contrib-mcq
              fi
          volumeMounts:
            - name: storage
              mountPath: /app/storage