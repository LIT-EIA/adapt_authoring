apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      initContainers:
        - name: init-storage
          image: node:18
          command:
            - sh
            - -c
            - |
              set -e

              mkdir -p /app/storage/plugins
              mkdir -p /app/storage/content
              mkdir -p /app/storage/uploads

              cd /app/storage/plugins

              # Initialize npm project only once
              if [ ! -f package.json ]; then
                echo "Initializing plugin directory..."
                npm init -y
              fi

              # Install default Adapt plugins only once
              if [ ! -d node_modules ]; then
                echo "Installing Adapt content plugins..."
                npm install \
                  adapt-contrib-text \
                  adapt-contrib-mcq \
                  adapt-contrib-graphic
              fi
          volumeMounts:
            - name: storage
              mountPath: /app/storage
