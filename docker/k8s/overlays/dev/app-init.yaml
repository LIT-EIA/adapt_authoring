apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

      initContainers:

        - name: wait-for-migration
          # TODO: Replace with Chainguard kubectl if available in your registry
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Checking for migration job..."
              if kubectl wait --for=condition=complete job/adapt-migration --timeout=10m; then
                echo "Migration completed - via app-init.yaml"
              else
                echo "Migration failed or timed out - via app-init.yaml"
                kubectl get job adapt-migration -o wide
                exit 1
              fi

        - name: fix-permissions
          # Switched from Docker Hub busybox to Chainguard FIPS-validated busybox
          image: cgr.dev/ssc-spc.gc.ca/busybox-fips:latest
          command:
            - sh
            - -c
            - |
              echo "Fixing permissions..."
              chown -R 65532:65532 /app/temp /app/storage /app/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data

        - name: init-config
          # Switched from Docker Hub busybox to Chainguard FIPS-validated busybox
          image: cgr.dev/ssc-spc.gc.ca/busybox-fips:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /app/conf
              echo '{}' > /app/conf/config.json
              chown -R 65532:65532 /app/conf
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app-config
              mountPath: /app/conf

        - name: build-translate
          image: dtsrhpdevscedacr.azurecr.io/cms_adapt_authoring_app:dev
          command:
            - sh
            - -c
            - |
              echo "Running translation build..."
              npx grunt build:translate
          volumeMounts:
            - name: temp
              mountPath: /app/temp
            - name: app-config
              mountPath: /app/conf
            - name: data
              mountPath: /app/data
            - name: storage
              mountPath: /app/storage

      containers:
        - name: app
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: app-config
              mountPath: /app/conf
            - name: home
              mountPath: /home/node

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-config
          emptyDir: {}
        - name: home
          emptyDir: {}



