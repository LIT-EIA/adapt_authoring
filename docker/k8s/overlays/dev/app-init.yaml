apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      initContainers:
        - name: init-storage
          image: busybox
          command:
            - sh
            - -c
            - 
             mkdir -p /app/storage/plugins
             mkdir -p /app/storage/content
             mkdir -p /app/storage/uploads
          volumeMounts:
            - name: storage
              mountPath: /app/storage
