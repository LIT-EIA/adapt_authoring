apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      initContainers:
        - name: init-storage
          image: busybox
          command:
            - sh
            - -c
            - |
              mkdir -p /app/storage/plugins/content
              mkdir -p /app/storage/content
              mkdir -p /app/storage/uploads

              # Copy bundled plugins ONLY if:
              # 1) Source exists
              # 2) Source is non-empty
              # 3) Target is empty
              if [ -d /app/default-plugins/content ] \
                 && [ "$(ls -A /app/default-plugins/content 2>/dev/null)" ] \
                 && [ -z "$(ls -A /app/storage/plugins/content 2>/dev/null)" ]; then
                echo "Copying default Adapt plugins to PVC..."
                cp -r /app/default-plugins/content/* /app/storage/plugins/content/
              else
                echo "No default plugins to copy or plugins already present"
              fi
          volumeMounts:
            - name: storage
              mountPath: /app/storage