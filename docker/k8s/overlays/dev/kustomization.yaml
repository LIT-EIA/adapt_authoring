apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - mongo-service.yaml
  - migration-job.yaml
  - app-rbac.yaml
  - temp-pvc.yaml
  - data-pvc.yaml

images:
  - name: ghcr.io/lit-eia/adapt-authoring
    newName: dtsrhpdevscedacr.azurecr.io/cms_adapt_authoring_app
    newTag: "dev"

patches:
  - path: mongo-init.yaml
    target:
      kind: Deployment
      name: mongo

  - path: app-init.yaml
    target:
      kind: Deployment
      name: app

  - path: migration-delete.yaml
    target:
      kind: Deployment
      name: migration

  - path: app-temp-volume-patch.yaml
    target:
      kind: Deployment
      name: app

  - path: app-data-volume-patch.yaml
    target:
      kind: Deployment
      name: app
  
  - path: migration-job-data.patch.yaml
    target:
      kind: Job
      name: adapt-migration
  

labels:
  - includeSelectors: true
    pairs:
      environment: dev
