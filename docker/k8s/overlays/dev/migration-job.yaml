apiVersion: batch/v1
kind: Job
metadata:
  name: adapt-migration
  namespace: adapt-authoring
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 600

  template:
    spec:
      restartPolicy: OnFailure

      imagePullSecrets:
        - name: regcred

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

      initContainers:
        - name: fix-permissions
          image: cgr.dev/ssc-spc.gc.ca/busybox-fips:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /app/data /app/storage /app/temp && \
              chown -R 65532:65532 /app/data /app/storage /app/temp
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp

      containers:
        - name: migrate
          image: dtsrhpdevscedacr.azurecr.io/cg_cms_adapt_authoring_mig:dev
          imagePullPolicy: Always

          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: MONGO_HOST
              value: mongo

          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: temp
              mountPath: /app/temp
            - name: data
              mountPath: /app/data

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: storage
        - name: temp
          persistentVolumeClaim:
            claimName: temp
        - name: data
          persistentVolumeClaim:
            claimName: data