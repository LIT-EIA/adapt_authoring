apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-reader
  namespace: adapt-authoring
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-can-read-jobs
  namespace: adapt-authoring
subjects:
  - kind: ServiceAccount
    name: default
    namespace: adapt-authoring
roleRef:
  kind: Role
  name: job-reader
  apiGroup: rbac.authorization.k8s.io
